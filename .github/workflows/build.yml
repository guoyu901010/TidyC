name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build
        run: dotnet build TidyC.sln -c Release

      - name: Run test suite (88 tests)
        run: dotnet run --project tests/TidyC.Core.TestRunner/TidyC.Core.TestRunner.csproj -c Release

      - name: Publish single-file executable
        run: >
          dotnet publish src/TidyC.App/TidyC.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: TidyC-win-x64
          path: publish/TidyC.exe
          if-no-files-found: error

      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/TidyC.exe
          generate_release_notes: true
