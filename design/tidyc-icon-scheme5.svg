<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="v5_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242527"/>
      <stop offset="60%" stop-color="#151617"/>
      <stop offset="100%" stop-color="#0D0D0E"/>
    </linearGradient>

    <linearGradient id="v5_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555861" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#18181A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Monolithic Ribbon Gradient: Blue to Emerald to White -->
    <linearGradient id="v5_ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58D1FF"/>
      <stop offset="35%" stop-color="#0078D4"/>
      <stop offset="70%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#3EF088"/>
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="v5_glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="v5_ribbonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0078D4" flood-opacity="0.5"/>
    </filter>
    <filter id="v5_dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#v5_bg)" stroke="url(#v5_border)" stroke-width="3" filter="url(#v5_dropShadow)"/>
  <rect x="38" y="38" width="436" height="436" rx="102" ry="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Centered Iconic Monogram 'C' in Infinite Ribbon Flow -->
  <g transform="translate(256, 256)">
    <!-- Outer ambient track glow -->
    <circle r="150" fill="none" stroke="#25272D" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

    <!-- Main Bold Continuous Ribbon 'C' -->
    <path d="M 96 -96 
             C 48 -144 -48 -144 -102 -90 
             C -156 -36 -156 56 -102 110 
             C -48 164 48 164 96 116 
             L 62 82 
             C 28 116 -40 116 -76 80 
             C -112 44 -112 -24 -76 -60 
             C -40 -96 28 -96 62 -62 
             Z"
          fill="url(#v5_ribbon)"
          filter="url(#v5_ribbonGlow)"/>

    <!-- Frosted Glass Facet Layer over the top -->
    <path d="M 96 -96 
             C 48 -144 -48 -144 -102 -90 
             C -156 -36 -156 56 -102 110 
             C -48 164 48 164 96 116 
             L 62 82 
             C 28 116 -40 116 -76 80 
             C -112 44 -112 -24 -76 -60 
             C -40 -96 28 -96 62 -62 
             Z"
          fill="url(#v5_glass)"/>

    <!-- Precision Sparkle on the tail (Hygiene & Clean System) -->
    <!-- Top terminal node -->
    <circle cx="96" cy="-96" r="14" fill="#18191C" stroke="#4CC2FF" stroke-width="3"/>
    <circle cx="96" cy="-96" r="6" fill="#A8EBFF"/>

    <!-- Bottom terminal node -->
    <circle cx="96" cy="116" r="14" fill="#18191C" stroke="#27C268" stroke-width="3"/>
    <circle cx="96" cy="116" r="6" fill="#6BFFAD"/>

    <!-- Central Floating Clean Sparkle (Four-point star) -->
    <path d="M 0 -28 L 6 -6 L 28 0 L 6 6 L 0 28 L -6 6 L -28 0 L -6 -6 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#58D1FF"/>
  </g>
</svg>